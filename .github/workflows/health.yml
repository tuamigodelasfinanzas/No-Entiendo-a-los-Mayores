name: Health check

# Every morning: this channel's traffic light on Telegram, with the same shared logic as the other channels
# (zero-understands/.github/workflows/health.yml). Read-only: it never renders or publishes.
#   - Instagram token: only once publishing is on (repo variable PUBLICAR = si), so it is not red before launch
#   - GitHub Pages and failed runs of this repo
on:
  schedule:
    # 07:45 Madrid: 07:15 is 05:15 UTC in summer (CEST) and 06:15 UTC in winter (CET). The "hora" job keeps
    # only the run of the right time zone and waits until 07:45 sharp (GitHub's cron often starts late).
    - cron: "15 5 * * *"
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.w.outputs.go }}
    steps:
      - id: w
        run: |
          [ "${{ github.event_name }}" = schedule ] || { echo go=true >> "$GITHUB_OUTPUT"; exit 0; }
          NOW=$(date +%s); T=$(TZ=Europe/Madrid date -d 'today 07:45' +%s); M=$(TZ=Europe/Madrid date +%H%M)
          if [ "$M" -lt 0700 ] || [ "$M" -ge 0805 ]; then echo "::notice::Madrid $M: el cron del otro horario, nada que hacer"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$NOW" -lt "$T" ] && sleep $((T - NOW))
          echo go=true >> "$GITHUB_OUTPUT"

  health:
    needs: hora
    if: needs.hora.outputs.go == 'true'
    uses: tuamigodelasfinanzas/zero-understands/.github/workflows/health.yml@main
    with:
      label: No Entiendo a los Mayores
      ig_check: ${{ vars.PUBLICAR == 'si' }}
      pages_urls: ${{ vars.PUBLICAR == 'si' && 'https://tuamigodelasfinanzas.github.io/No-Entiendo-a-los-Mayores/state/published.json' || '' }}
      runs_repos: tuamigodelasfinanzas/No-Entiendo-a-los-Mayores
    secrets:
      IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER: ${{ secrets.IG_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
