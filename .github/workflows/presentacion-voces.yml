name: Voces de los vídeos especiales

# Turns content/especiales/<especial>/lineas.json into voices (tools/presentacion_voces.py) and commits the mp3s
# back to the same branch: the voice service can't be reached from where the video is put together.
on:
  push:
    paths: ['content/especiales/*/lineas.json', 'content/voces/*/lineas.json', 'tools/presentacion_voces.py', '.github/workflows/presentacion-voces.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q edge-tts
      - name: Voces
        # each especial whose lines changed in this push (or that has no voices yet)
        run: |
          for d in content/especiales/*/ content/voces/*/; do
            [ -f "$d/lineas.json" ] || continue
            case "$d" in content/voces/*) n="${d%/}" ;; *) n=$(basename "$d") ;; esac
            if [ ! -f "$d/voces/duraciones.json" ] || ! git diff --quiet "${{ github.event.before }}" HEAD -- "$d/lineas.json" 2>/dev/null; then
              python3 tools/presentacion_voces.py "$n"
            fi
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add content/especiales content/voces
          git diff --cached --quiet || git commit -m "Especiales: voces generadas"
          git push
