name: Voces del Short de presentación

# Turns content/especiales/presentacion/lineas.json into voices (tools/presentacion_voces.py) and commits the mp3s
# back to the same branch: the voice service can't be reached from where the video is put together.
on:
  push:
    paths: ['content/especiales/presentacion/lineas.json', 'tools/presentacion_voces.py', '.github/workflows/presentacion-voces.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q edge-tts
      - name: Voces
        run: python3 tools/presentacion_voces.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add content/especiales/presentacion/voces content/especiales/presentacion/voces-pruebas
          git diff --cached --quiet || git commit -m "Presentación: voces generadas"
          git push
